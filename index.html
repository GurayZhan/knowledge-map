<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税务会计知识地图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f0f4f8;display:flex;min-height:100vh}
#loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f4f8;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:18px;color:#1e293b;font-weight:600;margin-bottom:8px}
#loadingMsg{font-size:14px;color:#64748b}
.progress-wrap{width:220px;height:4px;background:#e2e8f0;border-radius:2px;margin-top:16px;overflow:hidden}
#loadingBar{width:0;height:100%;background:#2563eb;border-radius:2px;transition:width .3s}
.sidebar{width:280px;min-width:280px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid #e2e8f0}
.sidebar-header h2{font-size:18px;color:#1e293b;margin-bottom:4px}
.sidebar-header p{font-size:12px;color:#94a3b8}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:4px}
.nav-group-title{padding:8px 20px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.nav-group-title:hover{background:#f8fafc}
.nav-group-title .arrow{font-size:10px;transition:transform .2s}
.nav-group-title .arrow.open{transform:rotate(90deg)}
.nav-item{padding:6px 20px 6px 36px;font-size:13px;color:#475569;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.nav-item:hover{background:#eff6ff;color:#2563eb}
.nav-item.active{background:#eff6ff;color:#2563eb;font-weight:600}
.nav-item .count{font-size:11px;color:#94a3b8;background:#f1f5f9;padding:1px 6px;border-radius:8px}
.main-content{flex:1;display:flex;flex-direction:column;min-width:0}
.search-bar{padding:16px 24px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}
.search-bar select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;color:#334155;background:#fff;cursor:pointer}
.search-bar input{flex:1;padding:8px 14px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;outline:none;color:#334155}
.search-bar input:focus{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.search-bar input::placeholder{color:#94a3b8}
.search-bar button{padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.search-bar button:hover{background:#1d4ed8}
.search-info{padding:10px 24px;font-size:13px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.search-info mark{background:#fef08a;padding:0 2px;border-radius:2px}
.content-area{flex:1;overflow-y:auto;padding:16px 24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:12px;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-header{display:flex;align-items:flex-start;margin-bottom:6px}
.card-source{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;margin-bottom:6px}
.source-12366{background:#dbeafe;color:#1e40af}
.source-esnai{background:#fef3c7;color:#92400e}
.card-title{font-size:15px;font-weight:600;color:#2563eb;cursor:pointer;line-height:1.4;flex:1;text-decoration:none}
.card-title:hover{color:#1d4ed8;text-decoration:underline}
.card-link{color:#94a3b8;font-size:14px;text-decoration:none;margin-left:8px;flex-shrink:0}
.card-link:hover{color:#2563eb}
.card-meta{font-size:12px;color:#94a3b8;margin-bottom:4px;display:flex;gap:16px;flex-wrap:wrap}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card-tag{font-size:11px;padding:1px 8px;border-radius:10px;background:#f1f5f9;color:#64748b}
.card-snippet{font-size:13px;color:#64748b;line-height:1.5;margin-bottom:8px;padding:6px 10px;background:#fffbeb;border-radius:4px}
.card-snippet mark{background:#fef08a;padding:0 2px;border-radius:2px}
.expand-btn{font-size:12px;color:#2563eb;cursor:pointer;padding:4px 0;display:inline-block;user-select:none}
.expand-btn:hover{color:#1d4ed8}
.card-body{font-size:14px;color:#475569;line-height:1.7;display:none;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;white-space:pre-wrap}
.card-body.open{display:block}
.card-reply{margin-top:8px;padding:10px 12px;background:#f8fafc;border-left:3px solid #2563eb;border-radius:0 6px 6px 0;font-size:13px;color:#475569;line-height:1.6;max-height:120px;overflow:hidden;position:relative;white-space:pre-wrap}
.card-reply.open{max-height:none}
.reply-expand{font-size:12px;color:#2563eb;cursor:pointer;margin-top:4px;display:inline-block}
.reply-expand:hover{color:#1d4ed8}
.esnai-replies{margin-top:8px}
.esnai-replies-toggle{font-size:13px;color:#2563eb;cursor:pointer;padding:6px 0}
.esnai-replies-toggle:hover{color:#1d4ed8}
.esnai-replies-content{display:none}
.esnai-reply-item{padding:8px 0;border-bottom:1px solid #f1f5f9}
.esnai-reply-item:last-child{border-bottom:none}
.esnai-reply-author{font-size:12px;color:#64748b;margin-bottom:4px}
.esnai-reply-text{font-size:13px;color:#475569;line-height:1.6;white-space:pre-wrap}
.pagination{display:flex;justify-content:center;gap:6px;padding:20px 0;flex-wrap:wrap}
.pagination button{padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#475569;font-size:13px;cursor:pointer}
.pagination button:hover{background:#f8fafc}
.pagination button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.pagination button:disabled{color:#cbd5e1;cursor:default}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8}
.empty-state h3{font-size:16px;color:#64748b;margin-bottom:8px}
@media(max-width:768px){.sidebar{display:none}.search-bar{flex-wrap:wrap}.card-meta{gap:8px}}
</style>
</head>
<body>
<div id="loadingOverlay">
<div class="spinner"></div>
<div class="loading-title">税务会计知识地图</div>
<div id="loadingMsg">正在连接...</div>
<div class="progress-wrap"><div id="loadingBar"></div></div>
</div>
<aside class="sidebar" id="sidebar">
<div class="sidebar-header"><h2>税务会计知识地图</h2><p>中国会计视野 + 12366 纳税服务平台</p></div>
<nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>
<main class="main-content">
<div class="search-bar">
<select id="sourceFilter"><option value="all">全部来源</option><option value="12366">12366 网上留言</option><option value="esnai">中国会计视野</option></select>
<input type="text" id="searchInput" placeholder="搜索标题、内容、税种...">
<button id="searchBtn">搜索</button>
</div>
<div class="search-info" id="searchInfo"></div>
<div class="content-area" id="contentArea"></div>
<div class="pagination" id="pagination"></div>
</main>
<script>
var TOTAL=18;
var allItems=[];
var currentChunk=0;
function loadChunk(){
  if(currentChunk>=TOTAL){
    var m=document.getElementById('loadingMsg'),b=document.getElementById('loadingBar');
    m.textContent='正在排序...';b.style.width='88%';
    allItems.sort(function(a,b){return a.d>b.d?-1:a.d<b.d?1:0;});
    filteredItems=allItems.slice();
    m.textContent='正在渲染...';b.style.width='96%';
    buildTree();renderList();updateInfo();
    b.style.width='100%';
    setTimeout(function(){var o=document.getElementById('loadingOverlay');o.style.opacity='0';o.style.transition='opacity .3s';setTimeout(function(){o.style.display='none';},300);},300);
    return;
  }
  var m=document.getElementById('loadingMsg'),b=document.getElementById('loadingBar');
  m.textContent='正在加载 ('+(currentChunk+1)+'/'+TOTAL+')...';
  fetch('data/c'+currentChunk+'.json')
    .then(function(r){return r.json();})
    .then(function(arr){
      allItems=allItems.concat(arr);
      b.style.width=Math.round(8+(currentChunk/TOTAL)*80)+'%';
      currentChunk++;
      setTimeout(loadChunk,10);
    })
    .catch(function(e){
      m.textContent='加载失败，重试中...';
      setTimeout(loadChunk,2000);
    });
}
setTimeout(loadChunk,200);

var filteredItems=[],currentPage=1,pageSize=20,currentCategory='all',currentSource='all',searchKeyword='';

function buildTree(){
  var nav=document.getElementById('sidebarNav'),c12366={},cEsnai={};
  allItems.forEach(function(d){
    if(d.s==='12366'){var cat=d.x||'其他';c12366[cat]=c12366[cat]||{};c12366[cat][d.g||'']=1;}
    else{var sec=d.sec||'其他';cEsnai[sec]=cEsnai[sec]||0;cEsnai[sec]++;}
  });
  var h='';
  var k12366=Object.keys(c12366).sort();
  if(k12366.length){
    h+='<div class="nav-group"><div class="nav-group-title" onclick="toggleGroup(this)"><span>12366 网上留言</span><span class="arrow open">▶</span></div><div class="nav-group-items">';
    h+='<div class="nav-item active" data-source="12366" data-cat="all" onclick="selectNav(this)"><span>全部</span><span class="count">'+allItems.filter(function(d){return d.s==='12366';}).length+'</span></div>';
    k12366.forEach(function(cat){
      h+='<div class="nav-item" data-source="12366" data-cat="'+cat.replace(/'/g,"&#39;")+'" onclick="selectNav(this)"><span>'+cat+'</span><span class="count">'+allItems.filter(function(d){return d.s==='12366'&&(d.x||'其他')===cat;}).length+'</span></div>';
    });
    h+='</div></div>';
  }
  var kEsnai=Object.keys(cEsnai).sort();
  if(kEsnai.length){
    h+='<div class="nav-group"><div class="nav-group-title" onclick="toggleGroup(this)"><span>中国会计视野</span><span class="arrow open">▶</span></div><div class="nav-group-items">';
    h+='<div class="nav-item" data-source="esnai" data-cat="all" onclick="selectNav(this)"><span>全部</span><span class="count">'+allItems.filter(function(d){return d.s==='esnai';}).length+'</span></div>';
    kEsnai.forEach(function(sec){
      h+='<div class="nav-item" data-source="esnai" data-cat="'+sec.replace(/'/g,"&#39;")+'" onclick="selectNav(this)"><span>'+sec+'</span><span class="count">'+cEsnai[sec]+'</span></div>';
    });
    h+='</div></div>';
  }
  nav.innerHTML=h;
}

function toggleGroup(el){var arrow=el.querySelector('.arrow'),items=el.nextElementSibling;arrow.classList.toggle('open');items.style.display=arrow.classList.contains('open')?'':'none';}
function selectNav(el){document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});el.classList.add('active');currentSource=el.dataset.source;currentCategory=el.dataset.cat;document.getElementById('sourceFilter').value=currentSource;filterAndSearch();}

function filterAndSearch(){
  var kw=searchKeyword.toLowerCase();
  filteredItems=allItems.filter(function(d){
    if(currentSource!=='all'&&d.s!==currentSource)return false;
    if(currentSource==='12366'&&currentCategory!=='all'&&(d.x||'其他')!==currentCategory)return false;
    if(currentSource==='esnai'&&currentCategory!=='all'&&(d.sec||'其他')!==currentCategory)return false;
    if(kw){var score=0;if(d.t&&d.t.toLowerCase().indexOf(kw)>=0)score+=3;if(d.c&&d.c.toLowerCase().indexOf(kw)>=0)score+=2;if(d.r&&d.r.toLowerCase().indexOf(kw)>=0)score+=1;if(d.rp&&d.rp.length){d.rp.forEach(function(r){if(r.t&&r.t.toLowerCase().indexOf(kw)>=0)score+=1;});}d._score=score;if(score===0)return false;}
    return true;
  });
  if(kw){filteredItems.sort(function(a,b){if(b._score!==a._score)return b._score-a._score;var da=new Date(a.d),db=new Date(b.d);var now=new Date(),sixMonths=180*86400000;var sa=da.getTime()>now-sixMonths?1:0,sb=db.getTime()>now-sixMonths?1:0;if(sa!==sb)return sb-sa;return db-da;});}
  currentPage=1;buildTree();renderList();updateInfo();
}

function updateInfo(){var info=document.getElementById('searchInfo');if(searchKeyword){info.innerHTML='搜索 "<mark>'+searchKeyword.replace(/</g,'&lt;')+'</mark>"，找到 '+filteredItems.length+' 条结果';}else{info.innerHTML='共 '+filteredItems.length+' 条';}}
function highlightText(text,kw){if(!kw||!text)return text;return text.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function renderList(){
  var area=document.getElementById('contentArea'),p=document.getElementById('pagination');
  var start=(currentPage-1)*pageSize,end=Math.min(start+pageSize,filteredItems.length);
  var items=filteredItems.slice(start,end);
  if(items.length===0){area.innerHTML='<div class="empty-state"><h3>没有找到相关内容</h3><p>请尝试其他关键词或分类</p></div>';p.innerHTML='';return;}
  var h='',kw=searchKeyword.toLowerCase();
  items.forEach(function(d,i){
    var snip='';
    if(kw){var txt='';if(d.t&&d.t.toLowerCase().indexOf(kw)>=0)txt=d.t;else if(d.c&&d.c.toLowerCase().indexOf(kw)>=0)txt=d.c;else if(d.r)txt=d.r;var idx=Math.max(0,txt.toLowerCase().indexOf(kw)-30);snip='...'+highlightText(txt.substring(idx,idx+120),kw)+'...';}
    var srcClass=d.s==='12366'?'source-12366':'source-esnai';
    var tags='';if(d.s==='12366'){if(d.x)tags+='<span class="card-tag">'+d.x+'</span>';if(d.g)tags+='<span class="card-tag">'+d.g+'</span>';}else{if(d.sec)tags+='<span class="card-tag">'+d.sec+'</span>';if(d.a)tags+='<span class="card-tag">'+d.a+'</span>';}
    var meta='';if(d.d)meta+='<span>'+d.d+'</span>';if(d.o)meta+='<span>答复:'+d.o+'</span>';if(d.rc)meta+='<span>'+d.rc+' 回复</span>';
    var lid=d.i||('r'+i);
    var replyBlock='';
    if(d.s==='12366'&&d.r){var shortR=d.r.length>300?d.r.substring(0,300)+'...':d.r;replyBlock='<div class="card-reply" id="reply-'+lid+'"><strong>答复：'+(d.o||'')+'</strong><br>'+highlightText(shortR,kw)+'</div>';if(d.r.length>300)replyBlock+='<div class="reply-expand" onclick="toggleReply(\'reply-'+lid+'\',this)">展开完整回复 ▼</div>';}
    if(d.s==='esnai'&&d.rp&&d.rp.length){replyBlock='<div class="esnai-replies"><div class="esnai-replies-toggle" onclick="toggleEsnaiReplies(\'er-'+lid+'\',this)">查看回帖 ('+d.rp.length+' 条) ▼</div><div class="esnai-replies-content" id="er-'+lid+'">';d.rp.forEach(function(r){replyBlock+='<div class="esnai-reply-item"><div class="esnai-reply-author">#'+r.f+' '+r.a+'</div><div class="esnai-reply-text">'+highlightText(r.t||'',kw)+'</div></div>';});replyBlock+='</div></div>';}
    h+='<div class="card"><span class="card-source '+srcClass+'">'+(d.s==='12366'?'12366 网上留言':'中国会计视野')+'</span><div class="card-header"><a class="card-title" href="'+d.l+'" target="_blank" rel="noopener">'+highlightText(d.t,kw)+'</a><a class="card-link" href="'+d.l+'" target="_blank" rel="noopener" title="查看原始网页">🔗</a></div><div class="card-meta">'+meta+'</div><div class="card-tags">'+tags+'</div>'+(snip?'<div class="card-snippet">'+snip+'</div>':'')+'<div class="expand-btn" onclick="toggleBody(\'body-'+lid+'\',this)">展开全文 ▼</div><div class="card-body" id="body-'+lid+'">'+highlightText(d.c||'',kw)+'</div>'+replyBlock+'</div>';
  });
  area.innerHTML=h;
  var totalPages=Math.ceil(filteredItems.length/pageSize);if(totalPages<=1){p.innerHTML='';return;}var ph='';for(var i=1;i<=totalPages;i++)ph+='<button'+(i===currentPage?' class="active"':'')+(i===currentPage?' disabled':'')+' onclick="goPage('+i+')">'+i+'</button>';p.innerHTML=ph;
}
function goPage(n){currentPage=n;renderList();contentArea.scrollTop=0;}
function toggleBody(id,btn){var el=document.getElementById(id);if(el.classList.contains('open')){el.classList.remove('open');btn.textContent='展开全文 ▼';}else{el.classList.add('open');btn.textContent='收起全文 ▲';}}
function toggleReply(id,btn){var el=document.getElementById(id);if(el.classList.contains('open')){el.classList.remove('open');btn.textContent='展开完整回复 ▼';}else{el.classList.add('open');btn.textContent='收起回复 ▲';}}
function toggleEsnaiReplies(id,btn){var el=document.getElementById(id);if(el.style.display==='block'){el.style.display='none';btn.textContent=btn.textContent.replace('▲','▼');}else{el.style.display='block';btn.textContent=btn.textContent.replace('▼','▲');}}
document.getElementById('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
document.getElementById('searchBtn').addEventListener('click',doSearch);
document.getElementById('sourceFilter').addEventListener('change',function(){currentSource=this.value;currentCategory='all';document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});filterAndSearch();});
function doSearch(){searchKeyword=document.getElementById('searchInput').value.trim();filterAndSearch();}
</script>
</body>
</html>
